[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goibert"
version = "1.0.0"
description = "GoiBERT: compact Vietnamese encoders via two-stage knowledge distillation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "transformers>=4.49,<5",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
